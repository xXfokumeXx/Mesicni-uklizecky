# Úklid neaktivních herních účtů a sdílených světů (3.3, U4) – tools/uklid-uctu.mjs.
# Firebase zůstává na tarifu Spark: Cloud Functions nejsou potřeba, Admin SDK běží tady.
# Tajné hodnoty (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  obsah JSON klíče servisního účtu ostrého projektu (nikdy do repozitáře)
#   FIREBASE_DATABASE_URL     https://moon-sweepers-0fq8i-default-rtdb.europe-west1.firebasedatabase.app
# GitHub vypíná plánované spouštění ve veřejném repozitáři po 60 dnech bez commitu – znovu se zapne v Actions
# → „Úklid účtů“ → Enable workflow. Postup je v docs/ucty-stav.md.
name: Úklid účtů

on:
  schedule:
    - cron: '17 3 * * *'          # denně ve 3:17 UTC
  workflow_dispatch:
    inputs:
      nanecisto:
        description: 'Jen vypsat, co by se smazalo (nic nemazat)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: uklid-uctu
  cancel-in-progress: false

jobs:
  uklid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Závislosti
        run: npm ci --no-audit --no-fund
        working-directory: tools
      - name: Úklid
        working-directory: tools
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          NANECISTO: ${{ github.event_name == 'workflow_dispatch' && inputs.nanecisto && '--nanecisto' || '' }}
        run: node uklid-uctu.mjs $NANECISTO
